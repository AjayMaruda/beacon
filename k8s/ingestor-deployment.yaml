apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestor-service
  template:
    metadata:
      labels:
        app: ingestor-service
    spec:
      containers:
        - name: ingestor-service
          image: beacon-ingestor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: beacon-config
                  key: MONGODB_URI
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: beacon-config
                  key: PORT_INGESTOR
