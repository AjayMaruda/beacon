apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon-mongo
  template:
    metadata:
      labels:
        app: beacon-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: beacon-mongo
spec:
  selector:
    app: beacon-mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
